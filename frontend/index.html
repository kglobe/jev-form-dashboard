<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 深淺主題：樣式載入前先依上次的選擇設好 data-theme 和底色，重新整理時不會閃一下另一套。
         localStorage 的 key 跟 App.vue 的 THEME_KEY 一樣；沒存過、私密視窗讀不到就用預設的淺色 -->
    <meta name="color-scheme" content="light dark" />
    <script>try { if (localStorage.getItem('jev-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch {}</script>
    <style>html, body { background: #e3e4e7; } html[data-theme="dark"], html[data-theme="dark"] body { background: #0e0f11; }</style>
    <meta name="description" content="上傳 CSV / Excel 或串接外部 API，交給 JEV 分析後產生可拖拉的個人儀表板。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23f25c1a'/%3E%3Cpath d='M4 12V8m4 4V4m4 8V7' stroke='%23121315' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>JEV 儀表板</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
